<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Are My Friend - Movie Trailer Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #eee, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.3; }
        }

        .start-screen {
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .animation-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
        }

        .text-element {
            position: absolute;
            opacity: 0;
            transform: scale(0.5) translateY(50px);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .title-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 8vw, 8rem);
            font-weight: 700;
            background: linear-gradient(45deg, #ffd700, #ffed4a, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            line-height: 1.2;
        }

        .subtitle-text {
            font-size: clamp(1rem, 3vw, 3rem);
            font-weight: 300;
            color: #e0e0e0;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .name-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 12vw, 12rem);
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .final-text {
            font-size: clamp(1.5rem, 4vw, 4rem);
            font-weight: 700;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Animation keyframes */
        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.3);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 2px 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255, 215, 0, 0.5);
            }
            50% {
                text-shadow: 2px 2px 10px rgba(0,0,0,0.8), 0 0 40px rgba(255, 215, 0, 0.8);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.9);
            }
        }

        /* The name slides up and shrinks slightly to make room for "You Are My Friend" */
        @keyframes nameMoveUp {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            to {
                opacity: 1;
                transform: scale(0.8) translateY(-26vh);
            }
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            animation: confettiFall 3s linear infinite;
        }

        .confetti:nth-child(odd) {
            background: #ff6b6b;
            width: 8px;
            height: 8px;
            animation-duration: 2.5s;
        }

        .confetti:nth-child(3n) {
            background: #4ecdc4;
            width: 6px;
            height: 12px;
            animation-duration: 3.5s;
        }

        .confetti:nth-child(4n) {
            background: #45b7d1;
            width: 12px;
            height: 6px;
            animation-duration: 2.8s;
        }

        .confetti:nth-child(5n) {
            background: #96ceb4;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation-duration: 3.2s;
        }

        .fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        .rainbow-emoji {
            position: fixed;
            top: 0;
            left: 0;
            font-size: 4rem;
            pointer-events: none;
            z-index: 41;
            will-change: transform;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
        }

        .cake-emoji {
            position: fixed;
            bottom: -100px;
            left: 0;
            font-size: 3.5rem;
            pointer-events: none;
            z-index: 42;
            will-change: transform, opacity;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
        }

        @keyframes floatUp {
            0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            25%  { transform: translate(20px, -25vh) rotate(-8deg); }
            50%  { transform: translate(-20px, -50vh) rotate(8deg); }
            75%  { transform: translate(15px, -75vh) rotate(-6deg); }
            100% { transform: translate(0, -110vh) rotate(0deg); opacity: 0; }
        }

        /* Prime Day: jeff.png swarm (size and position are set from JS) */
        .jeff-img {
            position: fixed;
            top: 0;
            left: 0;
            width: clamp(90px, 18vw, 180px);
            height: auto;
            pointer-events: none;
            z-index: 43;
            will-change: transform;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .deepdream-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 60;
            opacity: 0;
            mix-blend-mode: screen;
            background-image: 
                repeating-radial-gradient(circle at center, rgba(255, 0, 170, 0.35) 0px, rgba(255, 0, 170, 0.35) 3px, transparent 3px, transparent 45px),
                repeating-radial-gradient(circle at center, rgba(0, 255, 200, 0.3) 0px, rgba(0, 255, 200, 0.3) 4px, transparent 4px, transparent 65px),
                repeating-radial-gradient(circle at center, rgba(255, 220, 0, 0.25) 0px, rgba(255, 220, 0, 0.25) 2px, transparent 2px, transparent 30px);
            background-size: 90px 90px, 140px 140px, 60px 60px;
        }

        .deepdream-overlay.active {
            opacity: 1;
            animation: deepdreamSwirl 2.6s ease-in-out forwards;
        }

        @keyframes deepdreamSwirl {
            0%   { background-position: 0 0, 0 0, 0 0; filter: hue-rotate(0deg) blur(0px) saturate(1); }
            50%  { background-position: 60px 40px, -50px 70px, 30px -60px; filter: hue-rotate(180deg) blur(1.5px) saturate(2.2); }
            100% { background-position: 120px 90px, -100px 140px, 60px -120px; filter: hue-rotate(360deg) blur(0px) saturate(1); }
        }

        .dream-eye {
            position: fixed;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 61;
            opacity: 0;
            animation: dreamEyePop 2.6s ease-in-out forwards;
        }

        @keyframes dreamEyePop {
            0%   { opacity: 0; transform: scale(0.3) rotate(0deg); }
            20%  { opacity: 0.9; transform: scale(1.1) rotate(10deg); }
            80%  { opacity: 0.9; transform: scale(1) rotate(-8deg); }
            100% { opacity: 0; transform: scale(0.6) rotate(0deg); }
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-6px, 4px) rotate(-0.3deg); }
            20% { transform: translate(5px, -5px) rotate(0.3deg); }
            30% { transform: translate(-4px, 6px); }
            40% { transform: translate(6px, 3px) rotate(0.2deg); }
            50% { transform: translate(-5px, -4px); }
            60% { transform: translate(4px, 5px) rotate(-0.2deg); }
            70% { transform: translate(-6px, -3px); }
            80% { transform: translate(5px, -5px); }
            90% { transform: translate(-3px, 4px); }
        }

        .shake {
            animation: screenShake 0.35s linear infinite;
        }

        @keyframes screenShakeStrong {
            0% { transform: scale(1) translate(0,0); }
            15% { transform: scale(1.05) translate(-10px, 6px); }
            30% { transform: scale(0.97) translate(8px, -8px); }
            45% { transform: scale(1.03) translate(-6px, 5px); }
            60% { transform: scale(0.99) translate(5px, -4px); }
            100% { transform: scale(1) translate(0,0); }
        }

        .shake-strong {
            animation: screenShakeStrong 0.4s ease-out;
        }

        .matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1; /* behind the text, Jeffs, fireworks, confetti, and cakes */
            opacity: 0;
        }

        .light-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transform-origin: center top;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .start-button {
                padding: 15px 30px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <div class="start-screen" id="startScreen">
            <h1 style="font-family: 'Cinzel', serif; font-size: 3rem; margin-bottom: 2rem; background: linear-gradient(45deg, #ffd700, #ffed4a); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                You Are My Friend
            </h1>
            <p style="font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.8;">
                A tribute to the classic Flash experience
            </p>
            <button class="start-button" id="startButton">Begin Experience</button>
        </div>

        <div class="animation-container" id="animationContainer">
            <!-- Light rays for dramatic effect -->
            <div class="light-rays" style="transform: translate(-50%, -50%) rotate(45deg);"></div>
            <div class="light-rays" style="transform: translate(-50%, -50%) rotate(-45deg);"></div>
            <div class="light-rays" style="transform: translate(-50%, -50%) rotate(90deg);"></div>
            
            <!-- Animation sequence elements -->
            <div class="text-element subtitle-text" id="text1">In a world...</div>
            <div class="text-element subtitle-text" id="text2">Where friendship matters...</div>
            <div class="text-element title-text" id="text3">One person</div>
            <div class="text-element subtitle-text" id="text4">Stands above the rest...</div>
            <div class="text-element name-text" id="nameText">DAVID</div>
            <div class="text-element final-text" id="text5">You Are My Friend</div>
            <div class="text-element final-text" id="birthdayText" style="margin-top: 80px; font-size: clamp(1.2rem, 3vw, 3rem); color: #ff6b6b;">Happy Birthday!</div>
        </div>

        <canvas id="fireworksCanvas" class="fireworks-canvas"></canvas>
        <div id="deepdreamOverlay" class="deepdream-overlay"></div>
        <canvas id="matrixCanvas" class="matrix-canvas"></canvas>
    </div>

    <!-- Audio element for background music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://github.com/jc-sumo/youaremyfriend/raw/refs/heads/main/youaremyfriend.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        let animationStarted = false;
        
        function extractNameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameParam = urlParams.get('name');
            if (nameParam) {
                return nameParam.charAt(0).toUpperCase() + nameParam.slice(1).toLowerCase();
            }
            return 'David';
        }

        // Boolean flags: present in the URL = on. They stack freely,
        // e.g. ?name=David&birthday&primeday
        function shouldShowBirthday() {
            return new URLSearchParams(window.location.search).has('birthday');
        }

        function shouldShowPrimeDay() {
            return new URLSearchParams(window.location.search).has('primeday');
        }

        function getGreetingText(showBirthday, showPrimeDay) {
            if (showBirthday && showPrimeDay) return 'Happy Prime/Birthday!';
            if (showPrimeDay) return 'Happy Prime Day!';
            return 'Happy Birthday!';
        }

        function startAnimation() {
            if (animationStarted) return;
            animationStarted = true;

            const startScreen = document.getElementById('startScreen');
            const animationContainer = document.getElementById('animationContainer');
            const nameElement = document.getElementById('nameText');
            const bgMusic = document.getElementById('bgMusic');

            const userName = extractNameFromURL();
            nameElement.textContent = userName;

            startScreen.classList.add('hidden');
            animationContainer.style.opacity = '1';

            try {
                bgMusic.volume = 0.7;
                bgMusic.play().catch(error => {
                    console.log('Audio autoplay prevented:', error);
                    showAudioMessage();
                });
            } catch (e) {
                console.log('Audio not available:', e);
                showAudioMessage();
            }

            const showBirthday = shouldShowBirthday();
            const showPrimeDay = shouldShowPrimeDay();
            const showGreeting = showBirthday || showPrimeDay;

            document.getElementById('birthdayText').textContent = getGreetingText(showBirthday, showPrimeDay);

            const sequence = [
                { element: 'text1', showDelay: 500, hideDelay: 2200, animation: 'slideInLeft' },
                { element: 'text2', showDelay: 2500, hideDelay: 4200, animation: 'slideInRight' },
                { element: 'text3', showDelay: 4500, hideDelay: 6200, animation: 'zoomIn' },
                { element: 'text4', showDelay: 6500, hideDelay: 8200, animation: 'slideInLeft' },
                { element: 'nameText', showDelay: 8500, hideDelay: null, animation: 'zoomIn' },
                { element: 'text5', showDelay: 11000, hideDelay: null, animation: 'fadeInScale' }
            ];

            if (showGreeting) {
                sequence.push({ element: 'birthdayText', showDelay: 13000, hideDelay: null, animation: 'zoomIn' });
            }

            sequence.forEach(({ element, showDelay, hideDelay, animation }) => {
                setTimeout(() => {
                    const el = document.getElementById(element);
                    if (animation === 'slideInLeft') {
                        el.style.animation = 'slideInLeft 1s ease forwards';
                    } else if (animation === 'slideInRight') {
                        el.style.animation = 'slideInRight 1s ease forwards';
                    } else if (animation === 'zoomIn') {
                        el.style.animation = 'zoomIn 1.5s ease forwards';
                    } else if (animation === 'fadeInScale') {
                        el.style.animation = 'fadeInScale 2s ease forwards, pulse 2s ease-in-out infinite 2s, glow 3s ease-in-out infinite 2s';
                    }
                }, showDelay);

                if (hideDelay) {
                    setTimeout(() => {
                        const el = document.getElementById(element);
                        el.style.animation = 'fadeOut 0.8s ease forwards';
                    }, hideDelay);
                }
            });

            setTimeout(() => {
                const lightRays = document.querySelectorAll('.light-rays');
                lightRays.forEach((ray, index) => {
                    setTimeout(() => {
                        ray.style.opacity = '1';
                        ray.style.animation = 'fadeInScale 2s ease forwards';
                    }, index * 200);
                });
            }, 8000);

            // "The algorithm recognizes him" - DeepDream hallucination + shake,
            // timed right as the name zooms in
            setTimeout(() => {
                triggerDeepDream(2400);
            }, 8500);

            // Name slides up just before "You Are My Friend" lands, so the two
            // lines stack instead of overlapping
            setTimeout(() => {
                document.getElementById('nameText').style.animation = 'nameMoveUp 1.2s ease-in-out forwards';
            }, 10900);

            // Big finale: punch-shake, fireworks, confetti burst, and flying
            // rainbows when "You Are My Friend" lands
            setTimeout(() => {
                const container = document.querySelector('.container');
                container.classList.add('shake-strong');
                setTimeout(() => container.classList.remove('shake-strong'), 400);
                startClimaxEffects();
            }, 11000);

            // Extras that fire when the greeting appears
            if (showGreeting) {
                setTimeout(() => createConfetti(80), 13500);
            }

            // Birthday-only extras: floating cakes + Matrix rain wall
            if (showBirthday) {
                setTimeout(() => {
                    createCakes(8);
                    startMatrixRain(7000, showPrimeDay ? 'HAPPY PRIME/BIRTHDAY ' : 'HAPPY BIRTHDAY ');
                }, 13500);
            }

            // Prime Day extra: jeff.png bounces around like a DVD screensaver
            if (showPrimeDay) {
                setTimeout(() => startJeff(), 13500);
            }
        }

        function showAudioMessage() {
            const message = document.createElement('div');
            message.style.cssText = `
                position: fixed; 
                top: 20px; 
                right: 20px; 
                background: rgba(255,255,255,0.9); 
                color: #333; 
                padding: 10px 15px; 
                border-radius: 5px; 
                font-size: 14px; 
                z-index: 1000;
                cursor: pointer;
            `;
            message.textContent = 'Click here to enable audio';
            message.onclick = () => {
                const bgMusic = document.getElementById('bgMusic');
                bgMusic.play().then(() => {
                    message.remove();
                }).catch(() => {
                    message.textContent = 'Audio unavailable';
                });
            };
            document.body.appendChild(message);
            
            setTimeout(() => {
                if (message.parentNode) message.remove();
            }, 10000);
        }

        function createConfetti(count = 50) {
            const container = document.querySelector('.container');
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    container.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 100);
            }
        }

        function createCakes(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const cake = document.createElement('div');
                    cake.className = 'cake-emoji';
                    cake.textContent = '🎂';
                    cake.style.left = Math.random() * 90 + 'vw';
                    cake.style.animation = `floatUp ${4 + Math.random() * 3}s ease-in forwards`;
                    document.body.appendChild(cake);
                    setTimeout(() => cake.remove(), 8000);
                }, i * 300);
            }
        }

        // ===== Prime Day: the Jeff swarm =====
        // jeff.png must sit next to index.html in the repo.
        // Every Jeff bounces around like a DVD logo and spins at its own rate.
        // Every time a Jeff hits a wall, a new Jeff spawns on that wall.
        // Jeffs bounce off each other and off the on-screen text, so the swarm
        // stops growing once the window is as full as it physically can be.
        const JEFF_COOLDOWN_MS = 300;  // a single Jeff can't spawn twice within this many ms
        const JEFF_FILL = 0.55;        // "full" = Jeff collision circles cover this fraction of the window
        const JEFF_MAX = 150;          // hard ceiling so slow devices never choke
        const JEFF_RADIUS = 0.45;      // collision radius as a fraction of Jeff's width
        const JEFF_MIN_SPEED = 80;     // px/s: collisions never leave a Jeff stuck almost still
        const JEFF_TEXT_IDS = ['nameText', 'text5', 'birthdayText']; // text Jeffs bounce off

        function startJeff() {
            const probe = new Image();
            probe.onerror = () => {
                console.log('jeff.png not found - is it in the same folder as index.html?');
            };
            probe.onload = () => runJeffSwarm(probe.naturalWidth, probe.naturalHeight);
            probe.src = 'jeff.png';
        }

        function runJeffSwarm(naturalW, naturalH) {
            // Same size rule as the old CSS: 18vw, clamped to 90-180px
            const w = Math.min(180, Math.max(90, window.innerWidth * 0.18));
            const h = w * (naturalH / naturalW);
            const r = w * JEFF_RADIUS;

            // Circles can't pack perfectly, so "full" is a fraction of the window area
            const cap = Math.min(
                JEFF_MAX,
                Math.max(1, Math.floor(JEFF_FILL * window.innerWidth * window.innerHeight / (Math.PI * r * r)))
            );

            const rand = (min, max) => min + Math.random() * (max - min);
            const randSign = () => (Math.random() > 0.5 ? 1 : -1);
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const textEls = JEFF_TEXT_IDS.map(id => document.getElementById(id)).filter(Boolean);
            const jeffs = [];

            // Rectangles of the text that is currently visible on screen
            function readObstacles() {
                const out = [];
                for (const el of textEls) {
                    if (parseFloat(getComputedStyle(el).opacity) < 0.2) continue;
                    const b = el.getBoundingClientRect();
                    out.push({ l: b.left, t: b.top, r: b.right, b: b.bottom });
                }
                return out;
            }

            // Is there room for a Jeff circle centered here?
            function isFree(cx, cy, obstacles) {
                for (const j of jeffs) {
                    const dx = j.x + w / 2 - cx;
                    const dy = j.y + h / 2 - cy;
                    if (dx * dx + dy * dy < (2 * r + 2) * (2 * r + 2)) return false;
                }
                for (const o of obstacles) {
                    const dx = cx - clamp(cx, o.l, o.r);
                    const dy = cy - clamp(cy, o.t, o.b);
                    if (dx * dx + dy * dy < (r + 2) * (r + 2)) return false;
                }
                return true;
            }

            function addJeff(x, y, vx, vy) {
                const el = document.createElement('img');
                el.className = 'jeff-img';
                el.alt = '';
                el.src = 'jeff.png';
                el.style.width = w + 'px';
                el.style.height = h + 'px';
                document.body.appendChild(el);
                el.getBoundingClientRect(); // flush styles so the fade-in transition runs
                el.style.opacity = '1';

                const jeff = {
                    el, x, y, vx, vy,
                    angle: rand(0, 360),
                    spin: randSign() * rand(40, 280), // degrees per second, unique per Jeff
                    lastSpawn: 0
                };
                jeff.el.style.transform = `translate(${x}px, ${y}px) rotate(${jeff.angle}deg)`;
                jeffs.push(jeff);
            }

            // Find a free spot on the wall that was just hit (next to the Jeff that hit it)
            function findSpawnSpot(wall, parent, obstacles, W, H) {
                const vertical = wall === 'left' || wall === 'right';
                const half = vertical ? h / 2 : w / 2;
                const len = vertical ? H : W;
                const along = vertical ? parent.y + h / 2 : parent.x + w / 2;
                const step = 2 * r + 8;

                const candidates = [along + step, along - step, along + 2 * step, along - 2 * step];
                for (let i = 0; i < 24; i++) candidates.push(rand(half, Math.max(len - half, half)));

                for (const a of candidates) {
                    const pos = clamp(a, half, Math.max(len - half, half));
                    let cx, cy;
                    if (wall === 'left') { cx = w / 2; cy = pos; }
                    else if (wall === 'right') { cx = W - w / 2; cy = pos; }
                    else if (wall === 'top') { cx = pos; cy = h / 2; }
                    else { cx = pos; cy = H - h / 2; }

                    if (isFree(cx, cy, obstacles)) return { cx, cy };
                }
                return null;
            }

            function spawnVelocity(wall) {
                const away = rand(120, 240);
                const along = randSign() * rand(60, 200);
                if (wall === 'left') return [away, along];
                if (wall === 'right') return [-away, along];
                if (wall === 'top') return [along, away];
                return [along, -away];
            }

            // First Jeff starts somewhere random that isn't on top of the text
            {
                const obstacles = readObstacles();
                const W = window.innerWidth;
                const H = window.innerHeight;
                let cx = W / 2, cy = H / 2;
                for (let i = 0; i < 40; i++) {
                    const tx = rand(w / 2, Math.max(W - w / 2, w / 2));
                    const ty = rand(h / 2, Math.max(H - h / 2, h / 2));
                    if (isFree(tx, ty, obstacles)) { cx = tx; cy = ty; break; }
                }
                addJeff(cx - w / 2, cy - h / 2, randSign() * rand(120, 240), randSign() * rand(100, 220));
            }

            let last = performance.now();

            function frame(now) {
                const dt = Math.min((now - last) / 1000, 0.05); // seconds, clamped for tab-switches
                last = now;

                const W = window.innerWidth;
                const H = window.innerHeight;
                const maxX = Math.max(W - w, 0);
                const maxY = Math.max(H - h, 0);
                const obstacles = readObstacles(); // read before any writes this frame
                const hits = [];

                // 1. Move, spin, and bounce off the window edges
                for (const j of jeffs) {
                    j.x += j.vx * dt;
                    j.y += j.vy * dt;
                    j.angle += j.spin * dt;

                    let wall = null;
                    if (j.x <= 0) { if (j.vx < 0) { wall = 'left'; j.vx = -j.vx; } j.x = 0; }
                    else if (j.x >= maxX) { if (j.vx > 0) { wall = 'right'; j.vx = -j.vx; } j.x = maxX; }

                    if (j.y <= 0) { if (j.vy < 0) { wall = wall || 'top'; j.vy = -j.vy; } j.y = 0; }
                    else if (j.y >= maxY) { if (j.vy > 0) { wall = wall || 'bottom'; j.vy = -j.vy; } j.y = maxY; }

                    if (wall && now - j.lastSpawn > JEFF_COOLDOWN_MS) hits.push({ wall, j });
                }

                // 2. Jeff vs Jeff: equal-mass elastic bounce (two relaxation passes)
                for (let pass = 0; pass < 2; pass++) {
                    for (let a = 0; a < jeffs.length; a++) {
                        for (let b = a + 1; b < jeffs.length; b++) {
                            const A = jeffs[a];
                            const B = jeffs[b];
                            let dx = B.x - A.x;
                            let dy = B.y - A.y;
                            const distSq = dx * dx + dy * dy;
                            if (distSq >= 4 * r * r) continue;

                            let dist = Math.sqrt(distSq);
                            if (dist < 0.001) { dx = 1; dy = 0; dist = 1; }
                            const nx = dx / dist;
                            const ny = dy / dist;

                            const push = (2 * r - dist) / 2;
                            A.x -= nx * push; A.y -= ny * push;
                            B.x += nx * push; B.y += ny * push;

                            const vn = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
                            if (vn < 0) {
                                A.vx += vn * nx; A.vy += vn * ny;
                                B.vx -= vn * nx; B.vy -= vn * ny;
                            }
                        }
                    }
                }

                // 3. Jeff vs text, then keep everyone inside the window
                for (const j of jeffs) {
                    for (const o of obstacles) {
                        const cx = j.x + w / 2;
                        const cy = j.y + h / 2;
                        const dx = cx - clamp(cx, o.l, o.r);
                        const dy = cy - clamp(cy, o.t, o.b);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist >= r) continue;

                        let nx, ny, push;
                        if (dist > 0.0001) {
                            nx = dx / dist; ny = dy / dist; push = r - dist;
                        } else {
                            // Center is inside the text box: leave through the nearest side
                            const dl = cx - o.l, dr = o.r - cx, dt2 = cy - o.t, db = o.b - cy;
                            const m = Math.min(dl, dr, dt2, db);
                            if (m === dl) { nx = -1; ny = 0; push = dl + r; }
                            else if (m === dr) { nx = 1; ny = 0; push = dr + r; }
                            else if (m === dt2) { nx = 0; ny = -1; push = dt2 + r; }
                            else { nx = 0; ny = 1; push = db + r; }
                        }
                        j.x += nx * push;
                        j.y += ny * push;

                        const vn = j.vx * nx + j.vy * ny;
                        if (vn < 0) { j.vx -= 2 * vn * nx; j.vy -= 2 * vn * ny; }
                    }

                    j.x = clamp(j.x, 0, maxX);
                    j.y = clamp(j.y, 0, maxY);

                    const speed = Math.hypot(j.vx, j.vy);
                    if (speed < JEFF_MIN_SPEED) {
                        const k = speed > 0.001 ? JEFF_MIN_SPEED / speed : 0;
                        j.vx = k ? j.vx * k : randSign() * JEFF_MIN_SPEED;
                        j.vy = k ? j.vy * k : randSign() * JEFF_MIN_SPEED;
                    }
                }

                // 4. Draw
                for (const j of jeffs) {
                    j.el.style.transform = `translate(${j.x}px, ${j.y}px) rotate(${j.angle}deg)`;
                }

                // 5. Every wall hit spawns a new Jeff on that wall (if there's room)
                for (const { wall, j } of hits) {
                    if (jeffs.length >= cap) break;
                    const spot = findSpawnSpot(wall, j, obstacles, W, H);
                    if (!spot) continue;
                    const [vx, vy] = spawnVelocity(wall);
                    addJeff(spot.cx - w / 2, spot.cy - h / 2, vx, vy);
                    j.lastSpawn = now;
                }

                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
        }

        // ===== DeepDream hallucination + screen shake =====
        function triggerDeepDream(durationMs) {
            const overlay = document.getElementById('deepdreamOverlay');
            overlay.classList.add('active');

            const icons = ['👁️', '🐕', '🐶', '👁️'];
            for (let i = 0; i < 10; i++) {
                const eye = document.createElement('div');
                eye.className = 'dream-eye';
                eye.textContent = icons[Math.floor(Math.random() * icons.length)];
                eye.style.left = Math.random() * 90 + 'vw';
                eye.style.top = Math.random() * 90 + 'vh';
                eye.style.animationDelay = (Math.random() * 0.4) + 's';
                document.body.appendChild(eye);
                setTimeout(() => eye.remove(), durationMs + 500);
            }

            document.querySelector('.container').classList.add('shake');

            setTimeout(() => {
                overlay.classList.remove('active');
                document.querySelector('.container').classList.remove('shake');
            }, durationMs);
        }

        // ===== Matrix-style code rain wall =====
        function startMatrixRain(durationMs, message) {
            const canvas = document.getElementById('matrixCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.opacity = '1';
            const ctx = canvas.getContext('2d');

            const fontSize = 18;
            const columns = Math.floor(canvas.width / fontSize);
            const drops = new Array(columns).fill(1);
            const charIndex = new Array(columns).fill(0).map(() => Math.floor(Math.random() * message.length));

            const matrixTimer = setInterval(() => {
                ctx.fillStyle = 'rgba(12, 12, 12, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#3dff6e';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const char = message[charIndex[i] % message.length];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    charIndex[i]++;

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }, 50);

            setTimeout(() => {
                clearInterval(matrixTimer);
                canvas.style.transition = 'opacity 1.5s ease';
                canvas.style.opacity = '0';
                setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 1600);
            }, durationMs);
        }

        // ===== Big finale: fireworks + flying rainbows (Solitaire-style) =====
        let fireworksTimer = null;
        let fireworksFrameId = null;
        let fireworkParticles = [];

        function launchFirework(ctx, canvas) {
            const colors = ['#ff6b6b', '#ffd700', '#4ecdc4', '#45b7d1', '#96ceb4', '#ee5a24', '#ff9ff3'];
            const originX = Math.random() * canvas.width;
            const originY = canvas.height * (0.15 + Math.random() * 0.35);
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particleCount = 45;

            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const speed = 2 + Math.random() * 3;
                fireworkParticles.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    life: 1,
                    decay: 0.012 + Math.random() * 0.01
                });
            }
        }

        function animateFireworks(ctx, canvas) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireworkParticles = fireworkParticles.filter(p => p.life > 0);

            fireworkParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.04;
                p.life -= p.decay;

                ctx.globalAlpha = Math.max(p.life, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalAlpha = 1;
            fireworksFrameId = requestAnimationFrame(() => animateFireworks(ctx, canvas));
        }

        function startFireworks(durationMs) {
            const canvas = document.getElementById('fireworksCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');

            animateFireworks(ctx, canvas);
            fireworksTimer = setInterval(() => launchFirework(ctx, canvas), 500);

            setTimeout(() => clearInterval(fireworksTimer), durationMs);
            setTimeout(() => {
                cancelAnimationFrame(fireworksFrameId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, durationMs + 3000);
        }

        function createRainbows(count) {
            const rainbows = [];
            for (let i = 0; i < count; i++) {
                const rainbow = document.createElement('div');
                rainbow.className = 'rainbow-emoji';
                rainbow.textContent = '🌈';
                document.body.appendChild(rainbow);

                rainbows.push({
                    el: rainbow,
                    x: Math.random() * (window.innerWidth - 80),
                    y: Math.random() * (window.innerHeight - 80),
                    vx: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2),
                    vy: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2),
                    rotation: 0
                });
            }

            let bounceId;
            function bounce() {
                rainbows.forEach(r => {
                    r.x += r.vx;
                    r.y += r.vy;
                    r.rotation += 2;
                    if (r.x <= 0 || r.x >= window.innerWidth - 80) r.vx *= -1;
                    if (r.y <= 0 || r.y >= window.innerHeight - 80) r.vy *= -1;
                    r.el.style.transform = `translate(${r.x}px, ${r.y}px) rotate(${r.rotation}deg)`;
                });
                bounceId = requestAnimationFrame(bounce);
            }
            bounce();

            setTimeout(() => {
                cancelAnimationFrame(bounceId);
                rainbows.forEach(r => {
                    r.el.style.transition = 'opacity 1s ease';
                    r.el.style.opacity = '0';
                    setTimeout(() => r.el.remove(), 1000);
                });
            }, 14000);
        }

        function startClimaxEffects() {
            startFireworks(12000);
            createConfetti(120);
            createRainbows(5);
        }

        document.getElementById('startButton').addEventListener('click', startAnimation);

        document.addEventListener('DOMContentLoaded', () => {
            const userName = extractNameFromURL();
            const startScreen = document.getElementById('startScreen');
            if (userName !== 'David') {
                const namePreview = document.createElement('p');
                namePreview.style.cssText = 'font-size: 1rem; margin-top: 1rem; opacity: 0.6; font-style: italic;';
                namePreview.textContent = `Featuring: ${userName}`;
                startScreen.appendChild(namePreview);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                startAnimation();
            }
        });

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('fireworksCanvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            const matrixCanvas = document.getElementById('matrixCanvas');
            if (matrixCanvas) {
                matrixCanvas.width = window.innerWidth;
                matrixCanvas.height = window.innerHeight;
            }
        });
    </script>
</body>
